<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tina's Couture</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --brand-bg: #f3e2e2;
    --brand-ring: #e9d3d5;
    --brand-blush: #e0b9ba;
    --brand-coral: #ea9e9e;
    --brand-mauve: #a87272;
    --brand-mauveDark: #8a5b5b;
    --brand-mauveDeep: #6d4747;
    --brand-cream: #fdf6f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--brand-bg);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--brand-mauveDeep);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--brand-cream);
    border: 1px solid var(--brand-blush);
    border-radius: 28px;
    padding: 48px 32px;
  }
  .brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--brand-mauve);
    margin-bottom: 28px;
  }
  .spinner {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 4px solid var(--brand-ring);
    border-top-color: var(--brand-mauve);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--brand-mauveDeep);
  }
  p {
    font-size: 14px;
    color: var(--brand-mauveDeep);
    opacity: 0.75;
    margin: 0;
    line-height: 1.5;
  }
  .bar-track {
    margin-top: 28px;
    height: 6px;
    border-radius: 999px;
    background: var(--brand-ring);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 18%;
    border-radius: 999px;
    background: var(--brand-coral);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -18%; }
    100% { margin-left: 100%; }
  }
  .fallback {
    display: none;
    margin-top: 22px;
  }
  .fallback a {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 999px;
    background: var(--brand-mauve);
    color: var(--brand-cream);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .fallback a:hover { background: var(--brand-mauveDark); }
  .fallback p { margin-top: 12px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Tina's Couture</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="statusTitle">Getting the shop ready</h1>
    <p id="statusText">Just a moment while we open up.</p>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="fallback" id="fallback">
      <a href="#" id="fallbackLink">Continue to the shop</a>
      <p>Taking longer than usual — you can also just tap through.</p>
    </div>
  </div>

  <script>
    // ---- Configuration -----------------------------------------------
    // The Django backend's own origin (its subdomain), and the health
    // check path added to shop/urls.py.
    var APP_ORIGIN = "https://tinascouture.onrender.com";
    var HEALTH_PATH = "/health/";
    var POLL_INTERVAL_MS = 2500;
    var FALLBACK_AFTER_MS = 45000; // show manual "continue anyway" link
    // --------------------------------------------------------------------

    var statusTitle = document.getElementById("statusTitle");
    var statusText = document.getElementById("statusText");
    var fallback = document.getElementById("fallback");
    var fallbackLink = document.getElementById("fallbackLink");

    // If the visitor already has a return path (e.g. they were on a
    // product page when the app went to sleep), forward them back to it.
    var params = new URLSearchParams(window.location.search);
    var returnTo = params.get("to");
    var isLocalPath = returnTo && returnTo.charAt(0) === "/" && returnTo.charAt(1) !== "/";
    var destination = isLocalPath ? APP_ORIGIN + returnTo : APP_ORIGIN + "/";
    fallbackLink.href = destination;

    var attempts = 0;
    var started = Date.now();

    function goToApp() {
      window.location.replace(destination);
    }

    function poll() {
      attempts += 1;
      fetch(APP_ORIGIN + HEALTH_PATH, { cache: "no-store", mode: "cors" })
        .then(function (res) {
          if (res.ok) {
            statusTitle.textContent = "Ready!";
            statusText.textContent = "Taking you in now.";
            setTimeout(goToApp, 300);
          } else {
            scheduleNext();
          }
        })
        .catch(function () {
          scheduleNext();
        });
    }

    function scheduleNext() {
      if (Date.now() - started > FALLBACK_AFTER_MS) {
        fallback.style.display = "block";
        statusText.textContent = "The shop is opening up.";
      }
      setTimeout(poll, POLL_INTERVAL_MS);
    }

    poll();
  </script>
</body>
</html>
