<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tina's Couture</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --brand-bg: #f3e2e2;
    --brand-ring: #e9d3d5;
    --brand-blush: #e0b9ba;
    --brand-coral: #ea9e9e;
    --brand-mauve: #a87272;
    --brand-mauveDark: #8a5b5b;
    --brand-mauveDeep: #6d4747;
    --brand-cream: #fdf6f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--brand-bg);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--brand-mauveDeep);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--brand-cream);
    border: 1px solid var(--brand-blush);
    border-radius: 28px;
    padding: 48px 32px;
  }
  .brand {
    display: block;
    max-width: 100%;
    overflow: hidden;
    width: 14ch;
    margin: 0 auto 24px;
    white-space: nowrap;
  }
  .brand-text {
    display: inline-block;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--brand-mauve);
    white-space: nowrap;
    animation: carousel 3.2s ease-in-out infinite;
  }
  @keyframes carousel {
    0% { transform: translateX(100%); }
    15% { transform: translateX(100%); }
    85% { transform: translateX(-100%); }
    100% { transform: translateX(-100%); }
  }
  .brand.stopped .brand-text { animation-play-state: paused; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--brand-mauveDeep);
  }
  p {
    font-size: 14px;
    color: var(--brand-mauveDeep);
    opacity: 0.75;
    margin: 0;
    line-height: 1.5;
  }
  .fallback {
    display: none;
    margin-top: 22px;
  }
  .fallback a {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 999px;
    background: var(--brand-mauve);
    color: var(--brand-cream);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .fallback a:hover { background: var(--brand-mauveDark); }
  .fallback p { margin-top: 12px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand" aria-label="tina's couture"><span class="brand-text">TINA'S COUTURE</span></div>
    <div class="fallback" id="fallback">
      <a href="#" id="fallbackLink">Continue to the shop</a>
      <p>Taking longer than usual? Tap this.</p>
    </div>
  </div>

  <script>
    // ---- Configuration -----------------------------------------------
    // The Django backend's own origin (its subdomain), and the health
    // check path added to shop/urls.py.
    var APP_ORIGIN = "https://tinascouture.onrender.com";
    var HEALTH_PATH = "/health/";
    var POLL_INTERVAL_MS = 250;
    var AUTO_REDIRECT_AFTER_MS = 45000;
    var FALLBACK_AFTER_MS = 46000; // show manual "continue anyway" link
    // --------------------------------------------------------------------

    var fallback = document.getElementById("fallback");
    var fallbackLink = document.getElementById("fallbackLink");
    var brand = document.querySelector(".brand");

    // If the visitor already has a return path (e.g. they were on a
    // product page when the app went to sleep), forward them back to it.
    var params = new URLSearchParams(window.location.search);
    var returnTo = params.get("to");
    var isLocalPath = returnTo && returnTo.charAt(0) === "/" && returnTo.charAt(1) !== "/";
    var destination = isLocalPath ? APP_ORIGIN + returnTo : APP_ORIGIN + "/";
    fallbackLink.href = destination;

    var attempts = 0;
    var started = Date.now();
    var redirectStarted = false;

    function goToApp() {
      if (redirectStarted) return;
      redirectStarted = true;
      window.location.replace(destination);
    }

    setTimeout(goToApp, AUTO_REDIRECT_AFTER_MS);

    function poll() {
      attempts += 1;
      fetch(APP_ORIGIN + HEALTH_PATH, { cache: "no-store", mode: "cors" })
        .then(function (res) {
          if (res.ok) {
            goToApp();
          } else {
            scheduleNext();
          }
        })
        .catch(function () {
          scheduleNext();
        });
    }

    function scheduleNext() {
      if (Date.now() - started > FALLBACK_AFTER_MS) {
        fallback.style.display = "block";
        brand.classList.add("stopped");
      }
      setTimeout(poll, POLL_INTERVAL_MS);
    }

    poll();
  </script>
</body>
</html>
