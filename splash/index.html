<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tina's Couture</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --brand-bg: #f3e2e2;
    --brand-ring: #e9d3d5;
    --brand-blush: #e0b9ba;
    --brand-coral: #ea9e9e;
    --brand-mauve: #a87272;
    --brand-mauveDark: #8a5b5b;
    --brand-mauveDeep: #6d4747;
    --brand-cream: #fdf6f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--brand-bg);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--brand-mauveDeep);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--brand-cream);
    border: 1px solid var(--brand-blush);
    border-radius: 28px;
    padding: 48px 32px;
  }
  .brand {
    display: block;
    max-width: 100%;
    overflow: hidden;
    width: 14ch;
    margin: 0 auto 24px;
    white-space: nowrap;
  }
  .brand-text {
    display: inline-block;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--brand-mauve);
    white-space: nowrap;
    animation: carousel 3.2s ease-in-out infinite;
  }
  @keyframes carousel {
    0% { transform: translateX(100%); }
    15% { transform: translateX(100%); }
    85% { transform: translateX(-100%); }
    100% { transform: translateX(-100%); }
  }
  .brand.stopped .brand-text { animation-play-state: paused; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--brand-mauveDeep);
  }
  p {
    font-size: 14px;
    color: var(--brand-mauveDeep);
    opacity: 0.75;
    margin: 0;
    line-height: 1.5;
  }
  .loading {
    display: none;
    margin-top: 22px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--brand-blush);
    border-top-color: var(--brand-mauve);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading p {
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand" aria-label="tina's couture"><span class="brand-text">TINA'S COUTURE</span></div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading your experience...</p>
    </div>
  </div>

  <script>
    var APP_ORIGIN = "https://tinascouture.onrender.com";
    var LOADING_DISPLAY_MS = 50000; // 50 seconds
    var WARM_UP_PATH = "/";

    var loading = document.getElementById("loading");
    var brand = document.querySelector(".brand");

    // Determine destination
    var params = new URLSearchParams(window.location.search);
    var returnTo = params.get("to");
    var isLocalPath = returnTo && returnTo.charAt(0) === "/" && returnTo.charAt(1) !== "/";
    var destination = isLocalPath ? APP_ORIGIN + returnTo : APP_ORIGIN + "/";

    var warmUpStarted = false;
    var loadingStarted = false;

    function startWarmUp() {
      if (warmUpStarted) return;
      warmUpStarted = true;
      
      // Silently ping the server to wake it up
      fetch(APP_ORIGIN + WARM_UP_PATH, { 
        cache: "no-store", 
        mode: "cors",
        signal: AbortSignal.timeout(5000)
      }).catch(function () {
        // Silently fail - we'll redirect anyway after the loading period
      });
    }

    function startLoading() {
      if (loadingStarted) return;
      loadingStarted = true;
      loading.style.display = "block";
      brand.classList.add("stopped");
    }

    function redirectToApp() {
      window.location.replace(destination);
    }

    // Warm up the server immediately (silently)
    startWarmUp();

    // Show loading screen after a short delay
    setTimeout(startLoading, 500);

    // Redirect after 50 seconds
    setTimeout(redirectToApp, LOADING_DISPLAY_MS);
  </script>
</body>
</html>
