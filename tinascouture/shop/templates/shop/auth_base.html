<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tina's Couture{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { brand: { bg: '#f3e2e2', ring: '#e9d3d5', blush: '#e0b9ba', mauve: '#a87272', mauveDeep: '#6d4747', cream: '#fdf6f4' } } } } };
    </script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-brand-bg px-6 py-10 text-brand-mauveDeep">
    <main class="w-full">{% if messages %}<div class="mx-auto mb-4 max-w-md space-y-2">{% for message in messages %}<div class="rounded-xl border border-brand-blush bg-brand-ring px-4 py-3 text-sm">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main>
  </body>
</html>
