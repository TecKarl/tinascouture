{% extends "shop/auth_base.html" %}
{% block title %}Sign In — Tina's Couture{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-md">
  <p class="pb-2 pl-8 text-xl font-semibold tracking-[0.3em] text-brand-mauve uppercase">Tina's Couture</p>
  <section class="w-full space-y-6 rounded-3xl border border-brand-blush bg-brand-cream/70 p-8">
    <h1 class="text-3xl font-semibold text-brand-mauveDeep">Sign in</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
      <input name="identifier" required placeholder="Email or phone number" class="w-full rounded-xl border border-brand-blush p-3">
      <div class="relative">
        <input type="password" name="password" id="login-password" required placeholder="Password" class="w-full rounded-xl border border-brand-blush p-3 pr-12">
        <button type="button" data-password-toggle="login-password" aria-label="Show password" title="Show password" class="absolute inset-y-0 right-0 z-10 inline-flex w-12 items-center justify-center text-brand-mauveDeep hover:text-brand-mauveDark">
          <i class="fa-solid fa-eye-slash text-base" aria-hidden="true"></i>
        </button>
      </div>
      <button class="w-full rounded-full bg-brand-mauve px-5 py-3 font-semibold text-brand-cream">Sign in</button>
    </form>
    <p class="text-sm">New customer? <a class="font-semibold text-brand-mauve" href="{% url 'shop:signup' %}">Create an account</a></p>
  </section>
</div>
<script>
  document.querySelectorAll("[data-password-toggle]").forEach(function (toggle) {
    toggle.addEventListener("click", function () {
      var password = document.getElementById(toggle.dataset.passwordToggle);
      var icon = toggle.querySelector("i");
      var isHidden = password.type === "password";
      password.type = isHidden ? "text" : "password";
      icon.classList.toggle("fa-eye", isHidden);
      icon.classList.toggle("fa-eye-slash", !isHidden);
      toggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      toggle.setAttribute("title", isHidden ? "Hide password" : "Show password");
    });
  });
</script>
{% endblock %}
